# Regenerate R/, man/, tests/ and NAMESPACE from the {fusen} flat files in dev/,
# so that editing a flat template does not require a local R installation.
on:
  workflow_dispatch:
  push:
    paths:
      - 'dev/**.Rmd'

name: inflate

jobs:
  inflate:
    runs-on: ubuntu-latest
    concurrency:
      group: inflate-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install remotes
        run: |
          Rscript -e "install.packages('remotes')"

      - name: Install hyprcoloc
        run: |
          Rscript -e "remotes::install_version('Rcpp', version = '1.0.11')"
          Rscript -e "remotes::install_version('RcppEigen', version = '0.3.3.9.3')"
          Rscript -e "remotes::install_github('jrs95/hyprcoloc', build_opts = c('--resave-data', '--no-manual'), upgrade = 'never')"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            any::fusen
            any::attachment
            any::roxygen2

      # clean = TRUE removes files from a previous inflate that the flat file no
      # longer creates; without it, deleting a chunk leaves a stale R/*.R behind.
      - name: Inflate flat files
        shell: Rscript {0}
        run: |
          fusen::inflate(flat_file = "dev/flat_genomics_functions.Rmd", vignette_name = NA, check = FALSE, overwrite = TRUE, open_vignette = FALSE, clean = TRUE)
          fusen::inflate(flat_file = "dev/flat_miscellaneous.Rmd", vignette_name = NA, check = FALSE, overwrite = TRUE, open_vignette = FALSE, clean = TRUE)
          fusen::inflate(flat_file = "dev/LPC_targets_project.Rmd", vignette_name = "Create a New Targets Pipeline for LPC", check = FALSE, overwrite = TRUE, open_vignette = FALSE, clean = TRUE)

      # Pushes made with GITHUB_TOKEN do not trigger further workflow runs, and
      # the commit touches R/ and man/ rather than dev/**.Rmd, so this cannot loop.
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A R man tests vignettes NAMESPACE DESCRIPTION dev/config_fusen.yaml
          if git diff --staged --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "chore: inflate flat files [skip ci]"
            git push
          fi
